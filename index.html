<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка геолокации</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            text-align: center;
            padding: 40px 20px;
            margin: 0;
        }
        .container { max-width: 400px; margin: 0 auto; }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none; padding: 14px 28px; font-size: 16px; font-weight: 600;
            border-radius: 12px; cursor: pointer; width: 100%; margin-top: 20px;
        }
        p { font-size: 15px; color: #707579; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📍 Подтверждение присутствия</h2>
        <p id="status">Нажмите кнопку ниже, чтобы система определила ваши точные GPS-координаты.</p>
        <button onclick="requestGeo()">Определить местоположение</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function requestGeo() {
            document.getElementById('status').innerText = '🛰 Получаем GPS-координаты...';
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        
                        document.getElementById('status').innerText = '✅ Координаты найдены! Передаем в систему...';
                        tg.sendData(JSON.stringify({ lat: lat, lon: lon }));
                    },
                    function(error) {
                        document.getElementById('status').innerText = '❌ Ошибка доступа к GPS.';
                        alert('Пожалуйста, разрешите доступ к геолокации в настройках телефона.');
                    },
                    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
                );
            } else {
                alert('Геолокация не поддерживается вашим устройством.');
            }
        }
    </script>
</body>
</html>
